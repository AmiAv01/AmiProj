x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  restart: unless-stopped
  working_dir: /app
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-ami_project}
    DB_USERNAME: ${DB_USERNAME:-ami_user}
    DB_PASSWORD: ${DB_PASSWORD:-password}
    QUEUE_CONNECTION: database
  volumes:
    - ./:/app
    - ami_vendor:/app/vendor
    - ${DBF_HOST_PATH:-./storage/app/dbf}:/data/dbf:ro
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - ami_network

services:
  app:
    <<: *app-common
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/index.php SCRIPT_FILENAME=/app/public/index.php
          REQUEST_METHOD=GET REQUEST_URI=/api/health/live SERVER_NAME=localhost
          SERVER_PORT=80 SERVER_PROTOCOL=HTTP/1.1 HTTP_HOST=localhost
          cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null
          | grep -q '"status":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ami_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ami_project}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${DB_USERNAME:-ami_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ami_db:/var/lib/mysql
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    networks:
      - ami_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  queue-worker:
    <<: *app-common
    command:
      - sh
      - -c
      - >-
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done;
        exec php artisan queue:work database
        --sleep=3 --tries=3 --backoff=10 --timeout=60
        --max-time=3600 --memory=256
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app-common
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: node:22-alpine
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
      - ami_vendor:/app/vendor:ro
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  ami_db:
  ami_vendor:

networks:
  ami_network:
    driver: bridge
