version: '3'

vars:
  PHP: '{{if .LOCALLY}}php{{else}}docker compose exec -T app php{{end}}'
  COMPOSER: '{{if .LOCALLY}}composer{{else}}docker compose exec -T app composer{{end}}'
  NPM: '{{if .LOCALLY}}npm{{else}}docker compose run --rm frontend npm{{end}}'

tasks:
  up:
    desc: Build and start the development stack
    cmds:
      - docker compose up --detach --build --remove-orphans {{.CLI_ARGS}}

  down:
    desc: Stop the development stack
    cmds:
      - docker compose down --remove-orphans {{.CLI_ARGS}}

  shell:
    desc: Open a shell in the PHP container
    cmds:
      - docker compose exec app sh

  logs:
    desc: Follow application, web server, and worker logs
    cmds:
      - docker compose logs --follow app nginx queue-worker

  install:
    desc: Install PHP dependencies
    cmds:
      - '{{.COMPOSER}} install {{.CLI_ARGS}}'

  key:
    desc: Generate the application key
    cmds:
      - '{{.PHP}} artisan key:generate {{.CLI_ARGS}}'

  migrate:
    desc: Apply database migrations
    cmds:
      - '{{.PHP}} artisan migrate {{.CLI_ARGS}}'

  test:
    desc: Run the test suite
    cmds:
      - '{{.PHP}} artisan test {{.CLI_ARGS}}'

  format:
    desc: Format PHP code with Pint
    cmds:
      - '{{.PHP}} vendor/bin/pint {{.CLI_ARGS}}'

  pint:
    desc: Check PHP formatting
    cmds:
      - '{{.PHP}} vendor/bin/pint --test {{.CLI_ARGS}}'

  phpstan:
    desc: Run PHPStan/Larastan
    cmds:
      - '{{.PHP}} vendor/bin/phpstan --memory-limit=512M {{.CLI_ARGS}}'

  typecheck:
    desc: Type-check the Vue application
    cmds:
      - '{{.NPM}} run typecheck -- {{.CLI_ARGS}}'

  frontend-build:
    desc: Build production frontend assets
    cmds:
      - '{{.NPM}} run build -- {{.CLI_ARGS}}'

  vite:
    desc: Start the Vite development server
    cmds:
      - docker compose run --rm --service-ports frontend npm run dev -- --host 0.0.0.0 {{.CLI_ARGS}}

  composer-audit:
    desc: Check PHP dependencies for security advisories
    cmds:
      - '{{.COMPOSER}} audit --locked {{.CLI_ARGS}}'

  npm-audit:
    desc: Check JavaScript dependencies for high-severity advisories
    cmds:
      - '{{.NPM}} audit --audit-level=high {{.CLI_ARGS}}'

  queue-restart:
    desc: Gracefully restart queue workers
    cmds:
      - '{{.PHP}} artisan queue:restart'

  check:
    desc: Run the same core checks as CI
    cmds:
      - task: pint
      - task: phpstan
      - task: test
      - task: typecheck
      - task: composer-audit
      - task: npm-audit
