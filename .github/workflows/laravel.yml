name: Laravel CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Stage 1: Validate
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
      - uses: actions/checkout@v4
      - name: Validate composer.json
        run: composer validate --strict

  # Stage 2: Secret Scanning
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: Quality Gates
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
      - uses: actions/checkout@v4

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Pint - Code formatting
        run: vendor/bin/pint --test

      - name: PHPStan - Static analysis
        run: vendor/bin/phpstan --memory-limit=512M

      - name: Composer audit - Security vulnerabilities
        run: composer audit --locked

  # Stage 4: Frontend build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader --no-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

  # Stage 5: Tests
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [validate, secret-scan, quality, frontend]
    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
      - uses: actions/checkout@v4

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate

      - name: Execute tests via Pest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  mysql-migrations:
    name: MySQL migrations
    runs-on: ubuntu-latest
    needs: [validate]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ami_project
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_USER: ami_user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
          extensions: pdo_mysql

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ami_project
          DB_USERNAME: ami_user
          DB_PASSWORD: password
        run: php artisan migrate:fresh --force

  docker-image:
    # Validation only: the production host does not run Docker.
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [validate, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Docker target
        run: docker build --target production --tag "ami:${GITHUB_SHA}" .

  deploy:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [tests, mysql-migrations, docker-image]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader --no-dev

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add Host to Known Hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          RSYNC_OPTS=( -avz --delete-delay --delay-updates --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '.env*' --exclude 'storage' --exclude 'bootstrap/cache' --exclude 'public/storage' --exclude 'backups' )
          if [ -n "$SSH_PORT" ]; then
            RSYNC_OPTS+=( -e "ssh -p $SSH_PORT" )
          fi
          rsync "${RSYNC_OPTS[@]}" ./ "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH/"

      - name: Run remote post-deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$SSH_PORT" ]; then
            ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "cd '$DEPLOY_PATH' && php artisan migrate --force && php artisan storage:link --force && php artisan optimize && php artisan queue:restart"
          else
            ssh "$SSH_USERNAME@$SSH_HOST" "cd '$DEPLOY_PATH' && php artisan migrate --force && php artisan storage:link --force && php artisan optimize && php artisan queue:restart"
          fi

      - name: Run deployment smoke tests
        env:
          BASE_URL: ${{ secrets.DEPLOY_URL }}
        run: bash scripts/smoke-tests.sh
